version: '3'

volumes:
  local_postgres_data: { }
  local_postgres_data_backups: { }

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust

  django: &django
    build:
      context: ./
      dockerfile: ./compose/local/django/Dockerfile
    image: base-default-api
    depends_on:
      - postgres
    volumes:
      - ./api:/app
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.db
      - ./.envs/.local/.cloud
    ports:
      - "8000:8000"
    command: /start

  redis:
    image: redis:6.2

  celeryworker:
    <<: *django
    image: base-default-celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: base-default-celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat
